services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: traveloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d traveloop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://user:password@postgres:5432/traveloop"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "traveloop-x-super-secret-jwt-key-2026-hackathon"
      JWT_REFRESH_SECRET: "traveloop-x-refresh-secret-key-2026"
      JWT_EXPIRES_IN: "7d"
      NODE_ENV: "production"
      ALLOWED_ORIGINS: "http://localhost:3000,http://web:3000"
      ADMIN_TOKEN: "traveloop-admin-2026"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
      NEXT_PUBLIC_AI_URL: "http://localhost:8000"
      NEXT_PUBLIC_WS_URL: "http://localhost:3001"
      NEXT_PUBLIC_EXCHANGE_API_KEY: "YOUR_EXCHANGE_API_KEY"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"
      OPENWEATHER_API_KEY: "YOUR_OPENWEATHER_API_KEY"
      ALLOWED_ORIGINS: "http://localhost:3000,http://web:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
